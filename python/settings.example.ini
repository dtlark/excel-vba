; Settings for raw_invoices.py.
; Copy this file to settings.ini in the same folder, then fill in your own paths.
; They're the same as on the Settings tab of the VBA macro's workbook.
;
; Anywhere a path says {FY}, the script puts FY and the Fiscal year number,
; like FY26. Next year, change Fiscal year to 27 and every path follows.
; Quotes around a path are fine.

[Settings]
Fiscal year = 26

; The folder you save the vendor's Excel files into
RAW folder = C:\Invoices\{FY}\Excels\Raw

; Where processed RAW files go. Leave it blank for a Done folder inside the RAW folder
Done folder =

; The folder the Invoice <Tab Name> files are saved in
Invoice folder = C:\Invoices\{FY}\Excels

; The Master List's full path. The .xlsx can be left off
Master List file = C:\Invoices\{FY}\{FY} Master List
